<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCSR Rules</title>
  <meta name="description" content="The official ruleset for Minecraft Speedrunning.">
  <link rel="stylesheet" href="../style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("js").remove()
      fetch("../versions.json")
        .then(res => {
          if (!res.ok) {
            document.getElementById("newest").innerText = "can't get versions.json"
            throw new Error("http error status: " + response.status);
          }
          return res.json();
        })
        .then(data => {
          quicklink = document.getElementById("quicklink")
          newest = Object.keys(data)[0]
          quicklink.href = "../rules_" + newest + ".pdf"
          quicklink.innerText = newest

          // opens the link in a new tab 
          quicklink.setAttribute("target", "_blank");
          quicklink.setAttribute("rel", "noopener noreferrer");
          
          // clear the placeholder "Loading releases.."
          if (releases) releases.innerHTML = "";

          for ([ver, news] of Object.entries(data)) {
            url = "../rules_" + ver + ".pdf"

            // create a list item element
            const li = document.createElement("li");

            if (news) {
              // release link and changelog link classes
              li.innerHTML = `<a class="release-link" href="${url}" target="_blank" rel="noopener noreferrer">${ver}</a>`
                + `<a class="changelog-link" href="//www.speedrun.com/mc/news/${news}" target="_blank" rel="noopener noreferrer">Changelog</a>`;
            } else {
              li.innerHTML = `<a class="release-link" href="${url}" target="_blank" rel="noopener noreferrer">${ver}</a>`
                + (ver.includes("beta") ? `<em class="beta">(beta)</em>` : "");
            }

            releases.appendChild(li);

          }
        })
    })
  </script>
</head>
<body>
  <main class="page">
    <header>
        <a href="/"><img src="/favicon.ico" alt="Home" class="icon" width="38" height="38"></a>
        <h1 class="mojangles">Rules</h1>
    </header>
    <br>
    <section class="content-area">
      <h2 id="js">This site requires JavaScript!</h2>
      <div class="current-line" id="newest">Current: <a id="quicklink">Loading..</a></div>
      <br>
      <div class="rules-list-wrap">
        <h3 id="rules">All releases</h3>
        <ul id="releases" class="releases">
          <li class="loading">Loading releases...</li>
        </ul>
        <p class="note">
        The rules source is kept at <a href="https://github.com/Minecraft-Java-Edition-Speedrunning/rules">Minecraft-Java-Edition-Speedrunning/rules</a>.<br>
        Use <a href="/rules/">mc.sr/rules/</a> to always redirect to the current rules release.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
